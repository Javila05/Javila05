<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="230" y1="0" x2="970" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
      <stop offset="0.5" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(600 210) rotate(90) scale(170 460)">
      <stop stop-color="#14B8A6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#94A3B8" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="#05070B"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="28" fill="url(#glow)"/>

  <!-- top terminal controls -->
  <circle cx="42" cy="34" r="5" fill="#334155"/>
  <circle cx="60" cy="34" r="5" fill="#334155"/>
  <circle cx="78" cy="34" r="5" fill="#334155"/>
  <text x="100" y="39" fill="#64748B" font-size="15" font-family="Consolas, 'Courier New', monospace">~/profile/juan-avila</text>

  <!-- side code ornaments -->
  <text x="82" y="114" fill="#14B8A6" fill-opacity="0.55" font-size="22" font-family="Consolas, 'Courier New', monospace">&lt;/&gt;</text>
  <text x="1085" y="245" fill="#22D3EE" fill-opacity="0.45" font-size="22" font-family="Consolas, 'Courier New', monospace">{ }</text>

  <!-- main content -->
  <g filter="url(#shadow)">
    <text x="600" y="108" text-anchor="middle" fill="#5EEAD4" font-size="18" font-weight="700"
      letter-spacing="7" font-family="Arial, Helvetica, sans-serif">SOFTWARE DEVELOPER</text>

    <text x="600" y="182" text-anchor="middle" fill="#F8FAFC" font-size="64" font-weight="800"
      letter-spacing="-1.5" font-family="Arial, Helvetica, sans-serif">Juan Avila</text>

    <rect x="390" y="205" width="420" height="3" rx="2" fill="url(#accent)"/>

    <text x="600" y="248" text-anchor="middle" fill="#CBD5E1" font-size="20" font-weight="500"
      letter-spacing="1" font-family="Arial, Helvetica, sans-serif">.NET  •  SQL Server  •  React  •  Next.js</text>
  </g>

  <text x="600" y="286" text-anchor="middle" fill="#64748B" font-size="14"
    letter-spacing="3" font-family="Arial, Helvetica, sans-serif">GUATEMALA</text>

  <!-- subtle corner accents -->
  <path d="M26 86V26H86" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.55"/>
  <path d="M1114 294H1174V234" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.35"/>
</svg>